<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThiSmart — Comprehensive Wireframe Explorer</title>
<style>
:root{--ink:#0f172a;--slate:#475569;--muted:#64748b;--primary:#2563eb;--primary-dark:#1d4ed8;--pale:#eff6ff;--border:#e2e8f0;--background:#f8fafc;--white:#fff;--green:#15803d;--green-soft:#f0fdf4;--amber:#b45309;--amber-soft:#fffbeb;--red:#b91c1c;--red-soft:#fef2f2;--radius:14px;--shadow:0 6px 20px rgba(15,23,42,.035),0 1px 3px rgba(15,23,42,.03)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--background);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}svg{display:inline-block;vertical-align:middle;flex:none}a{color:inherit;text-decoration:none}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Top Navigation Bar */
.wireframe-nav{background:#0b1329;color:#cbd5e1;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;position:sticky;top:0;z-index:40;border-bottom:1px solid #1e293b}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.brand-badge{background:#2563eb;color:#fff;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800}
.role-pills{display:flex;gap:6px;flex-wrap:wrap}
.role-btn{color:#94a3b8;background:#172338;border:1px solid #273958;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;transition:all .15s}
.role-btn.active{background:#2563eb;color:#fff;border-color:#3b82f6;box-shadow:0 0 12px rgba(37,99,235,.4)}
.screen-selector{display:flex;align-items:center;gap:8px}
.screen-select{background:#172338;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;min-width:240px}

/* Meta Inspector Bar */
.meta-inspector{background:#f1f5f9;border-bottom:1px solid #e2e8f0;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px}
.meta-chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-weight:700;font-size:11px}
.chip-id{background:#dbeafe;color:#1e40af}
.chip-route{background:#e2e8f0;color:#334155;font-family:monospace}
.chip-db{background:#fef3c7;color:#92400e}
.chip-api{background:#dcfce7;color:#166534}

/* Shell Layouts */
.shell-container{min-height:calc(100vh - 96px)}
.work-shell{display:flex;min-height:calc(100vh - 96px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--border);padding:24px 14px;flex:none}
.sidebar-header{padding:0 12px 24px}
.sidebar-title{font-size:16px;font-weight:800;letter-spacing:-.4px}
.sidebar-sub{font-size:11px;color:var(--muted)}
.side-group{font-size:10px;font-weight:800;color:#94a3b8;letter-spacing:1px;padding:14px 12px 6px;text-transform:uppercase}
.side-item{display:flex;align-items:center;gap:12px;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--slate);font-weight:600;margin-bottom:3px;cursor:pointer;transition:background .12s}
.side-item:hover{background:#f8fafc;color:var(--ink)}
.side-item.active{background:var(--pale);color:var(--primary);font-weight:750}
.side-bottom{border-top:1px solid var(--border);margin:24px 12px 0;padding-top:16px;display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:800;font-size:12px}

.work-main{flex:1;min-width:0;display:flex;flex-direction:column}
.work-top{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.breadcrumbs{font-size:13px;color:var(--muted)}
.breadcrumbs strong{color:var(--ink)}
.work-content{max-width:1440px;margin:0 auto;width:100%;padding:30px 36px 60px}

/* Page Components */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.page-head h1{font-size:24px;letter-spacing:-.6px;margin:0 0 4px;font-weight:800}
.page-head p{color:var(--muted);margin:0;font-size:13px}
.eyebrow{color:var(--primary);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}

.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.stat-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}
.stat-big{font-size:28px;font-weight:850;letter-spacing:-1px;display:block;margin:10px 0 2px}
.stat-sub{font-size:11px;color:var(--green);font-weight:600}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.panel-head h2{font-size:16px;font-weight:800;margin:0}

/* Tables */
.data-table{width:100%;border-collapse:collapse;text-align:left}
.data-table th{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #edf2f7;padding:12px 10px;font-weight:750}
.data-table td{font-size:13px;color:var(--slate);padding:14px 10px;border-bottom:1px solid #f1f5f9}
.data-table tr:hover td{background:#fafcff}
.data-table tr:last-child td{border-bottom:none}
.cell-title{font-weight:750;color:var(--ink);display:block}

/* Badges & Buttons */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:750;padding:4px 8px;border-radius:20px;white-space:nowrap}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-blue{background:var(--pale);color:var(--primary)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-gray{background:#f1f5f9;color:var(--slate)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.btn-primary,.btn-secondary,.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;font-weight:750;padding:10px 16px;font-size:13px;transition:all .14s}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.15)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;border-color:#cbd5e1;color:var(--slate)}
.btn-secondary:hover{background:#f8fafc;border-color:#94a3b8;color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#991b1b}

/* Focus Exam Room Specifics */
.exam-shell{min-height:calc(100vh - 96px);display:flex;flex-direction:column}
.exam-top{background:#fff;border-bottom:1px solid var(--border);padding:14px 36px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.exam-top-left{display:flex;align-items:center;gap:16px}
.exam-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:10px;display:grid;place-items:center}
.exam-title-box strong{font-size:15px;font-weight:800;display:block}
.exam-title-box small{font-size:12px;color:var(--muted)}
.exam-top-right{display:flex;align-items:center;gap:14px}
.timer-pill{border:1px solid #dbeafe;background:#f8fbff;border-radius:10px;padding:6px 14px;display:flex;align-items:center;gap:10px}
.timer-pill small{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;display:block}
.timer-pill strong{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.save-pill{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:30px;border:1px solid #bbf7d0;background:var(--green-soft);color:var(--green)}
.save-pill.saving{border-color:#bfdbfe;background:var(--pale);color:var(--primary)}
.save-pill.offline{border-color:#fecaca;background:var(--red-soft);color:var(--red)}

.exam-progress-bar{background:#fff;border-bottom:1px solid #edf2f7;padding:12px 36px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.progress-box{display:flex;align-items:center;gap:14px;flex:1;max-width:500px}
.progress-track{height:8px;background:#e2e8f0;border-radius:30px;flex:1;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:30px;transition:width .25s}

.exam-layout{width:100%;max-width:1440px;margin:0 auto;padding:28px 36px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;flex:1;align-items:start}
.question-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px;min-height:500px;box-shadow:var(--shadow)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.q-count{background:#eff6ff;color:#1e40af;border:1px solid #dbeafe;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px}
.q-flag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--slate);border:1px solid var(--border);border-radius:8px;padding:7px 12px;background:#fff}
.q-flag.active{color:var(--amber);background:var(--amber-soft);border-color:#fcd34d}
.q-type-label{font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px}
.q-statement{font-size:20px;font-weight:750;line-height:1.5;margin:0 0 26px;letter-spacing:-.4px}

.options-list{display:grid;gap:12px}
.opt-card{border:1.5px solid #e2e8f0;border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .14s;position:relative}
.opt-card:hover{border-color:#93c5fd;background:#fafcff}
.opt-card.selected{border-color:var(--primary);background:var(--pale);box-shadow:0 0 0 1px var(--primary)}
.opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;flex:none}
.opt-card.selected .opt-radio{border-color:var(--primary)}
.opt-card.selected .opt-radio:after{content:"";width:8px;height:8px;background:var(--primary);border-radius:50%}
.opt-letter{font-weight:800;color:var(--muted);width:16px;flex:none}
.opt-card.selected .opt-letter{color:var(--primary)}
.opt-text{flex:1;color:var(--slate);font-size:14px}
.opt-card.selected .opt-text{color:#1e40af;font-weight:650}

.navigator-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:sticky;top:70px}
.nav-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.nav-kpi-box{background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:10px;text-align:center}
.nav-kpi-box strong{font-size:22px;font-weight:850;display:block}
.nav-kpi-box small{font-size:11px;color:var(--muted)}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:260px;overflow-y:auto;padding:2px}
.pal-btn{height:38px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:750;color:var(--slate);position:relative}
.pal-btn.answered{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.pal-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary)}
.pal-btn.flagged:after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--amber);border-radius:50%;border:1.5px solid #fff}

.exam-footer{background:#fff;border-top:1px solid var(--border);padding:14px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}

/* Modal Backdrops */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.modal-card{background:#fff;border-radius:18px;padding:32px;width:min(100%,480px);box-shadow:0 20px 60px rgba(15,23,42,.25)}
.modal-icon{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

.hidden{display:none!important}
@media(max-width:1100px){.exam-layout{grid-template-columns:1fr}.navigator-panel{display:none}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{display:none}.wireframe-nav{padding:8px 12px}.work-content{padding:18px 14px}.work-top{padding:0 16px}}
</style>
</head>
<body>

<!-- Navigation Header -->
<header class="wireframe-nav">
  <div class="nav-brand">
    <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;box-shadow:0 2px 6px rgba(37,99,235,.4)">T</div>
    ThiSmart <span class="brand-badge">WIREFRAME v2.0</span>
  </div>
  
  <div class="role-pills" role="tablist">
    <button class="role-btn" data-role="auth">🔐 1. Auth</button>
    <button class="role-btn active" data-role="student">🎓 2. Student</button>
    <button class="role-btn" data-role="exam">🎯 3. Focus Room</button>
    <button class="role-btn" data-role="teacher">👨‍🏫 4. Teacher</button>
    <button class="role-btn" data-role="admin">🛡️ 5. Admin</button>
  </div>

  <div class="screen-selector">
    <select id="screen-select" class="screen-select" aria-label="Chọn màn hình wireframe chi tiết"></select>
  </div>
</header>

<!-- Technical Meta Inspector -->
<div class="meta-inspector" id="meta-bar">
  <div class="meta-chips">
    <span class="chip chip-id" id="chip-id">SCR-STU-03</span>
    <span class="chip chip-route" id="chip-route">/exam/[attemptId]</span>
    <span class="chip chip-db" id="chip-db">CSDL: exam_attempts, attempt_answers</span>
    <span class="chip chip-api" id="chip-api">API: PATCH /answers, POST /submit</span>
  </div>
  <div>
    <button class="btn-secondary" id="offline-sim-btn" style="padding:4px 10px;font-size:11px">⚡ Thử mất mạng</button>
  </div>
</div>

<!-- Main Screen Render Outlet -->
<main id="screen-outlet" class="shell-container"></main>

<!-- Modals Container -->
<div id="modal-outlet"></div>

<script>
'use strict';
const I={
  cap:'<svg class="icon" viewBox="0 0 24 24"><path d="m2 10 10-6 10 6-10 6-10-6Z"/><path d="M6 12.4V17c3 3 9 3 12 0v-4.6"/><path d="M22 10v7"/></svg>',

// Screen Registry
const SCREENS = [
  // Auth
  { id:'SCR-AUTH-01', role:'auth', name:'Đăng nhập hệ thống', route:'/login', db:'users, personal_access_tokens', api:'POST /api/v1/auth/login' },
  { id:'SCR-AUTH-02', role:'auth', name:'Đăng ký Thí sinh', route:'/register', db:'users (role=student)', api:'POST /api/v1/auth/register' },
  { id:'SCR-AUTH-03', role:'auth', name:'Quên mật khẩu', route:'/forgot-password', db:'users', api:'POST /api/v1/auth/forgot-password' },

  { id:'SCR-STU-01', role:'student', name:'Ca thi của tôi', route:'/student/exams', db:'session_assignments, exam_sessions', api:'GET /api/v1/student/assigned-sessions' },
  { id:'SCR-STU-02', role:'student', name:'Kiểm tra điều kiện thi', route:'/student/exams/[id]/instructions', db:'exam_sessions, exams', api:'POST /api/v1/exam-sessions/{id}/attempts' },

  // Teacher
  { id:'SCR-TEA-01', role:'teacher', name:'Tổng quan Giảng viên', route:'/teacher', db:'subjects, exams, exam_sessions', api:'GET /api/v1/auth/me' },
  { id:'SCR-TEA-02', role:'teacher', name:'Quản lý Môn học & Chủ đề', route:'/teacher/subjects', db:'subjects, topics', api:'GET/POST /api/v1/subjects' },
  { id:'SCR-TEA-03', role:'teacher', name:'Ngân hàng Câu hỏi', route:'/teacher/questions', db:'questions, topics', api:'GET /questions, PATCH /status' },
  { id:'SCR-TEA-04', role:'teacher', name:'Soạn thảo Câu hỏi', route:'/teacher/questions/new', db:'questions', api:'POST /questions, PUT /questions/{id}' },
  { id:'SCR-TEA-05', role:'teacher', name:'Thiết kế Đề thi Mẫu', route:'/teacher/exams/[id]/edit', db:'exams, exam_questions', api:'POST /exams/{id}/questions' },
  { id:'SCR-TEA-06', role:'teacher', name:'Lập lịch Ca thi & Gán SV', route:'/teacher/sessions/[id]/edit', db:'exam_sessions, session_assignments', api:'POST /sessions, POST /publish' },
  { id:'SCR-TEA-07', role:'teacher', name:'Giám sát Phòng thi Trực tiếp', route:'/teacher/sessions/[id]/monitor', db:'exam_sessions, proctoring_events', api:'GET /monitor-stream, POST /close' },
  { id:'SCR-TEA-08', role:'teacher', name:'Báo cáo Phổ điểm Ca thi', route:'/teacher/sessions/[id]/results', db:'exam_sessions, exam_attempts', api:'GET /api/v1/exam-sessions/{id}/results' },

// 1. Focus Exam Room
function renderFocusExam() {
  const qNum = examState.curQ;
  const answeredCount = Object.keys(examState.answers).length;
  const isFlagged = examState.flagged.has(qNum);
  const saveLabel = examState.offline ? '⚠ Mất mạng (Chờ đồng bộ)' : (examState.saveState === 'saved' ? '✓ Đã lưu tất cả thay đổi' : 'Đang lưu đáp án...');
  const saveClass = examState.offline ? 'offline' : (examState.saveState === 'saved' ? 'saved' : 'saving');

  let navBtns = '';
  for (let i = 0; i < 40; i++) {
    const isAns = examState.answers[i] !== undefined;
    const isCur = i === qNum;
    const isFl = examState.flagged.has(i);
    navBtns += `<button class="pal-btn ${isAns?'answered':''} ${isCur?'active':''} ${isFl?'flagged':''}" onclick="goQuestion(${i})">${String(i+1).padStart(2,'0')}</button>`;
  }

  const options = [
    { letter:'A', text:'POST' },
    { letter:'B', text:'PUT (Selected)' },
    { letter:'C', text:'PATCH' },
    { letter:'D', text:'DELETE' }
  ];

  let optHTML = options.map((opt, idx) => {
    const isSel = examState.answers[qNum] === idx;
    return `<div class="opt-card ${isSel?'selected':''}" onclick="chooseOption(${idx})">
      <div class="opt-radio"></div>
      <span class="opt-letter">${opt.letter}.</span>
      <span class="opt-text">${opt.text}</span>
      ${isSel ? `<span style="color:var(--primary)">${I.check}</span>`:''}
    </div>`;
  }).join('');

  $('screen-outlet').innerHTML = `
    <div class="exam-shell">
      <header class="exam-top">
        <div class="exam-top-left">
          <div class="exam-mark">${I.cap}</div>
          <div class="exam-title-box">
            <strong>Lập trình Web nâng cao (IT4409) — K21</strong>
            <small>Kỳ thi Giữa kỳ • Khóa thi EX-2026-012</small>
          </div>
        </div>
        <div class="exam-top-right">
          <div style="text-align:right">
            <strong style="font-size:13px;display:block">Nguyễn Văn A</strong>
            <small style="color:var(--muted)">MSSV: 21020015</small>
          </div>
          <div class="timer-pill">
            <span style="color:var(--primary)">${I.clock}</span>
            <div>
              <small>Thời gian còn lại</small>
              <strong id="timer-val">45:12</strong>
            </div>
          </div>
          <div class="save-pill ${saveClass}">${I.cloud} <span>${saveLabel}</span></div>
        </div>
      </header>

      <div class="exam-progress-bar">
        <div class="progress-box">
          <strong style="font-size:12px;white-space:nowrap">Tiến độ ${answeredCount}/40 câu (${Math.round(answeredCount/40*100)}%)</strong>
          <div class="progress-track"><div class="progress-fill" style="width:${answeredCount/40*100}%"></div></div>
        </div>
        <small style="color:var(--muted)">Đồng hồ chuẩn máy chủ • Tự động lưu đáp án sau 500ms</small>
      </div>

      <div class="exam-layout">
        <section class="question-panel">
          <div class="q-head">
            <span class="q-count">CÂU HỎI ${String(qNum+1).padStart(2,'0')} / 40 &nbsp;•&nbsp; 0.25 ĐIỂM</span>
            <button class="q-flag ${isFlagged?'active':''}" onclick="toggleFlag(${qNum})">${I.flag} ${isFlagged?'Đã đánh dấu':'Đánh dấu xem lại'}</button>
          </div>
          <div class="q-type-label">CÂU HỎI TRẮC NGHIỆM ĐƠN LỰA CHỌN (SINGLE CHOICE)</div>
          <h1 class="q-statement">Trong kiến trúc RESTful API, phương thức HTTP nào có tính chất Idempotent và thường được sử dụng để thay thế toàn bộ nội dung của tài nguyên đích?</h1>
          <div class="options-list">${optHTML}</div>
        </section>

        <aside class="navigator-panel">
          <div class="panel-head">
            <h2>Điều hướng câu hỏi</h2>
            <small style="color:var(--muted)">${answeredCount}/40 Đã làm</small>
          </div>
          <div class="nav-kpi">
            <div class="nav-kpi-box"><strong>${answeredCount}</strong><small>Đã trả lời</small></div>
            <div class="nav-kpi-box"><strong>${40 - answeredCount}</strong><small>Chưa làm</small></div>
          </div>

          <div style="margin:16px 0;font-size:12px;color:var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:8px;font-weight:700">

        <button class="btn-secondary" onclick="goQuestion(${Math.max(0, qNum-1)})" ${qNum===0?'disabled':''}>${I.left} Câu trước</button>

    </div>
  `;

window.chooseOption = function(idx) {
  examState.answers[examState.curQ] = idx;
  examState.saveState = 'saving';
  renderFocusExam();
  setTimeout(() => {
    examState.saveState = 'saved';
    renderFocusExam();
  }, 400);
};

window.goQuestion = function(i) {
  examState.curQ = i;
  renderFocusExam();
};

window.toggleFlag = function(i) {
  if (examState.flagged.has(i)) examState.flagged.delete(i);
  else examState.flagged.add(i);
  renderFocusExam();
};

// Handlers
document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const role = btn.dataset.role;
    populateSelect(role);
    const firstInRole = SCREENS.find(s => s.role === role);
    if (firstInRole) setScreen(firstInRole.id);
  });
});

$('screen-select').addEventListener('change', e => {
  setScreen(e.target.value);
});

$('offline-sim-btn').addEventListener('click', () => {
  examState.offline = !examState.offline;
  $('offline-sim-btn').classList.toggle('btn-danger', examState.offline);
  $('offline-sim-btn').textContent = examState.offline ? '⚡ Khôi phục mạng' : '⚡ Thử mất mạng';
  if (currentScreenId === 'SCR-STU-03') renderFocusExam();
});

// Init
populateSelect('student');
setScreen('SCR-STU-03');
