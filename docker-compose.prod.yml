# ==============================================================================
# Production Docker Compose Architecture for Exam Platform
# Reference: docs/06-operations-devops/21-DEPLOYMENT.md & AGENTS.md
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CORE API BACKEND (Laravel 13 & PHP 8.3-FPM Multi-Stage Container)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: exam-platform-api:latest
    container_name: exam_prod_api
    restart: always
    environment:
      APP_NAME: "${APP_NAME:-ExamPlatform}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-exam_platform}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-secret}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend_network

  # ----------------------------------------------------------------------------
  # 2. QUEUE WORKER POOL (Supervisor-managed Laravel Workers)
  # ----------------------------------------------------------------------------
  queue:
    image: exam-platform-api:latest
    container_name: exam_prod_queue
    restart: always
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    user: root
    environment:
      APP_NAME: "${APP_NAME:-ExamPlatform}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-exam_platform}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-secret}"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend_network

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY GATEWAY (Nginx Production with Security & Rate Limiting)
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: exam_prod_web
    restart: always
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - backend_network
      - frontend_network

  # ----------------------------------------------------------------------------
  # 4. WEB CLIENT FRONTEND (Next.js 15 Standalone Runner)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}"
    image: exam-platform-client:latest
    container_name: exam_prod_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_BACKEND_URL: "http://web:80/api/v1"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}"
    depends_on:
      - web
    networks:
      - frontend_network

  # ----------------------------------------------------------------------------
  # 5. DATABASE (PostgreSQL 16 Alpine with Healthcheck)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: exam_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-exam_platform}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-exam_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # ----------------------------------------------------------------------------
  # 6. DISTRIBUTED CACHE & QUEUE BROKER (Redis 7 Alpine with Persistence)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: exam_prod_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-secret}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

# ------------------------------------------------------------------------------
# NETWORKS (Defense-in-Depth Network Segmentation)
# ------------------------------------------------------------------------------
networks:
  backend_network:
    driver: bridge
    internal: false
  frontend_network:
    driver: bridge
    internal: false

# ------------------------------------------------------------------------------
# VOLUMES (Persistent Storage)
# ------------------------------------------------------------------------------
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  app_storage:
    driver: local
