# ==============================================================================
# Production Nginx Configuration for Exam Platform
# Reference: docs/06-operations-devops/21-DEPLOYMENT.md & AGENTS.md
# ==============================================================================

# Rate Limiting Zones (Memory-efficient binary IP tracking)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Hide Nginx server version banner
    server_tokens off;

    # Request Body Size Limit (Allow file uploads up to 25MB)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Production Security Headers (Defense-in-Depth)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    index index.php;
    charset utf-8;

    # --------------------------------------------------------------------------
    # Gzip Compression Optimization
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Static Assets & Healthcheck (No Log Overhead)
    # --------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fast Healthcheck probe routing without rate limit
    location = /api/v1/health {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Strict Rate Limiting for Authentication Endpoints (Brute-Force Defense)
    location ~* ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # General API Route Handling with Burst Protection
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # --------------------------------------------------------------------------
    # PHP-FPM FastCGI Handler
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Strip backend technology leakage headers
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-CF-Powered-By;

        # FastCGI Buffer Tuning for high concurrency
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # Deny Access to Sensitive Files (.env, .git, etc.)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
